<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{KURZTITEL}}</title>
<script>window.onerror = (m, s, l) => { window.__err = m + ' @' + (s || '').split('/').pop() + ':' + l; };</script>
<style>
  :root {
    --bg: #17121c; --ink: #2a2833; --paper: #fffcf3; --cream: #f5ead3; --coral: #ee7e6a; --mustard: #e2a83a;
    --petrol: #1e6b6e; --bar: rgba(28, 22, 34, 0.78); --muted: #cfc6d8;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--paper); overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  #frame { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { display: block; background: var(--cream); box-shadow: 0 10px 60px rgba(0,0,0,.5); cursor: pointer; }
  body:not(.awake).playing, body:not(.awake).playing #stage { cursor: none; }

  /* Untertitel (optional) */
  #subs { position: fixed; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none;
    padding: 0 8%; line-height: 1.35; }
  #subs span { display: inline; background: rgba(30, 24, 36, .82); color: #fff8ea; padding: .15em .5em;
    border-radius: .3em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

  /* Steuerleiste */
  #ui { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(980px, calc(100% - 32px));
    background: var(--bar); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 10px 14px 12px;
    transition: opacity .35s, transform .35s; }
  body.playing:not(.awake) #ui { opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }
  #track { position: relative; height: 18px; cursor: pointer; touch-action: none; }
  #track::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); }
  #bar { position: absolute; left: 0; top: 7px; height: 4px; border-radius: 2px; background: var(--mustard); }
  #bar::after { content: ""; position: absolute; right: -7px; top: -5px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--paper); box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  #ticks i { position: absolute; top: 4px; width: 2px; height: 10px; background: rgba(255,255,255,.45); border-radius: 1px; }
  .row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  button { appearance: none; border: 0; background: transparent; color: var(--paper); width: 40px; height: 40px;
    border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font: inherit; }
  button:hover { background: rgba(255,255,255,.1); }
  button:focus-visible { outline: 2px solid var(--mustard); outline-offset: 2px; }
  button svg { width: 22px; height: 22px; }
  button.on { background: var(--mustard); color: var(--ink); }
  button.off { opacity: .5; }
  #btnPlay { width: 46px; height: 46px; background: var(--coral); color: #fff; border-radius: 50%; }
  #btnPlay:hover { background: #f39180; }
  #time { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); margin: 0 8px; white-space: nowrap; }
  #chap { flex: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chapWrap { position: relative; }
  #chapWrap ol { position: absolute; right: 0; bottom: 52px; width: 330px; max-height: 60vh; overflow: auto; margin: 0; padding: 6px;
    list-style: none; background: #231b2b; border: 1px solid rgba(255,255,255,.1); border-radius: 12px; display: none;
    box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #chapWrap.open ol { display: block; }
  #chapters li { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #chapters li:hover { background: rgba(255,255,255,.08); }
  #chapters li.on { background: rgba(226,168,58,.22); }
  #chapters b { color: var(--mustard); width: 18px; text-align: right; }
  #chapters span { flex: 1; }
  #chapters em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Startbildschirm */
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(23,18,28,.35); }
  #start.hidden { display: none; }
  .card { background: var(--paper); color: var(--ink); border-radius: 18px; padding: 28px 34px 24px; text-align: center; max-width: 520px;
    margin: 16px; box-shadow: 0 16px 60px rgba(0,0,0,.45); border: 3px solid #fff; outline: 6px solid var(--coral); }
  .card h1 { font-family: "Segoe Print", "Ink Free", "Comic Sans MS", cursive; font-size: clamp(22px, 3.2vw, 34px); margin: 4px 0 6px; color: #2c58c9; }
  .card p { margin: 0 0 18px; color: #5a5160; }
  #startBtn { width: 88px; height: 88px; border-radius: 50%; background: var(--coral); color: #fff; box-shadow: 0 6px 0 #cc5d4d; }
  #startBtn:hover { background: #f39180; }
  #startBtn svg { width: 44px; height: 44px; margin-left: 6px; }
  .keys { margin-top: 18px; font-size: 13px; color: #6d6474; line-height: 1.8; }
  kbd { font-family: inherit; font-size: 12px; background: var(--cream); border: 1px solid #d9c9a8; border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--ink); }

  #hint { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); background: var(--bar); padding: 8px 16px; border-radius: 10px;
    font-size: 15px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #hint.show { opacity: 1; }
  body.export #ui, body.export #start, body.export #subs, body.export #hint { display: none; }
  body.export #stage { box-shadow: none; }
  @media (max-width: 640px) { #time { display: none; } #ui { bottom: 8px; padding: 8px 10px; } }
  /* eingebettet in ein Arbeitsblatt (iframe): kleine Bühne, kompakte Bedienung */
  body.eingebettet .card { padding: 14px 18px 12px; max-width: 320px; outline-width: 4px; }
  body.eingebettet .card p, body.eingebettet .keys { display: none; }
  body.eingebettet .card h1 { font-size: 20px; }
  body.eingebettet #startBtn { width: 60px; height: 60px; }
  body.eingebettet #startBtn svg { width: 30px; height: 30px; }
  body.eingebettet #ui { bottom: 6px; width: calc(100% - 12px); padding: 4px 8px 6px; border-radius: 10px; }
  body.eingebettet button { width: 34px; height: 34px; }
  body.eingebettet #btnPlay { width: 38px; height: 38px; }
  body.eingebettet #chap { font-size: 12px; }
  body.eingebettet #hint { top: 8px; font-size: 13px; }
</style>
</head>
<body class="awake">
<div id="frame"><canvas id="stage" width="1920" height="1080" aria-label="Animation: {{TITEL}}"></canvas></div>
<div id="subs" aria-live="polite"></div>
<div id="hint"></div>

<div id="ui">
  <div id="track" title="Zeitleiste"><div id="ticks"></div><div id="bar"></div></div>
  <div class="row">
    <button id="btnPrev" title="Vorherige Szene (←)"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor"/></svg></button>
    <button id="btnPlay"></button>
    <button id="btnNext" title="Nächste Szene (→)"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z" fill="currentColor"/></svg></button>
    <span id="time">0:00</span>
    <span id="chap"></span>
    <button id="btnLesson" title="Unterrichtsmodus: nach jeder Szene anhalten (P)"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 9h6M9 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button id="btnSubs" title="Untertitel ein/aus (U)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 11h4M13 11h4M7 15h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button id="btnMute" title="Ton aus/an (M)"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <div id="chapWrap"><button id="btnChap" title="Kapitel"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button><ol id="chapters"></ol></div>
    <button id="btnFull" title="Vollbild (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>

<div id="start">
  <div class="card">
    <h1>{{TITEL}}</h1>
    <p>Eine Papiertheater-Erzählung in {{SZENEN}} Szenen · {{MINUTEN}}</p>
    <button id="startBtn" title="Abspielen"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg></button>
    <div class="keys"><kbd>Leertaste</kbd> Start/Pause · <kbd>←</kbd><kbd>→</kbd> Szene · <kbd>F</kbd> Vollbild<br>
      <kbd>U</kbd> Untertitel · <kbd>P</kbd> Unterrichtsmodus (Pause nach jeder Szene)</div>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="figures.js"></script>
<script src="bausteine.js"></script>
<script src="karten.js"></script>
<script src="buehne.js"></script>
<script src="bienen.js"></script>
<script src="welt_stock.js"></script>
<script src="szenen.js"></script>
<script src="player.js"></script>
</body>
</html>
