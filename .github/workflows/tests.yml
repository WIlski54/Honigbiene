name: Arbeitsblatt pruefen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: arbeitsblatt/requirements.txt
      - run: npm ci
      - run: npm run check:repo
      - run: npm test
      - run: npm run build:ab
      - run: python -m pip install -r requirements.txt 'pytest>=8,<10'
        working-directory: arbeitsblatt
      - run: python -m pytest -q
        working-directory: arbeitsblatt
